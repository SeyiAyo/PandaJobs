services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: pandajobs:dev
    container_name: pandajobs-dev
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
