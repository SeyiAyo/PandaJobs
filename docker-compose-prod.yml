services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pandajobs:prod
    container_name: pandajobs-prod
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - pandajobs_media:/app/media
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  pandajobs_media:
