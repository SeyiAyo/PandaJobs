{% extends 'base.html' %}

{% block title %}Search Jobs{% endblock %}

{% block content %}
<div class="bg-gray-100 min-h-screen py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Search Form -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Search Jobs</h2>
            <form id="search-form" class="space-y-4" method="GET">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="query" class="block text-sm font-medium text-gray-700">Keywords</label>
                        <input type="text" name="query" id="query" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                        <input type="text" name="location" id="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="source" class="block text-sm font-medium text-gray-700">Search Source</label>
                        <select name="source" id="source" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                            <option value="local">Local Jobs</option>
                            <option value="external">External Jobs</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Search Jobs
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div id="job-results" class="max-w-4xl mx-auto">
            <!-- Loading Spinner -->
            <div id="loading-spinner" class="hidden">
                <div class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>
            </div>
        </div>

        <!-- Load More Button -->
        <div id="load-more-container" class="text-center mt-8 hidden">
            <button id="load-more" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Load More
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    let hasNextPage = false;

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function performSearch(append = false) {
        const query = document.getElementById('query').value;
        const location = document.getElementById('location').value;
        const source = document.getElementById('source').value;
        
        if (!append) {
            currentPage = 1;
        }

        const spinner = document.getElementById('loading-spinner');
        const loadMoreContainer = document.getElementById('load-more-container');
        spinner.classList.remove('hidden');
        loadMoreContainer.classList.add('hidden');

        try {
            const params = new URLSearchParams({
                query: query,
                location: location,
                source: source,
                page: currentPage
            });

            const response = await fetch(`/jobs/api/search/?${params}`);
            const data = await response.json();

            if (!append) {
                document.getElementById('job-results').innerHTML = '';
            }

            if (data.error) {
                displayError(data.error);
                return;
            }

            displayJobs(data.jobs, append);
            hasNextPage = data.has_next;
            loadMoreContainer.classList.toggle('hidden', !hasNextPage);

        } catch (error) {
            displayError('An error occurred while searching for jobs');
            console.error('Search error:', error);
        } finally {
            spinner.classList.add('hidden');
        }
    }

    function displayJobs(jobs, append = false) {
        const resultsDiv = document.getElementById('job-results');
        
        if (!append) {
            resultsDiv.innerHTML = '';
        }
        
        if (!jobs || jobs.length === 0 && !append) {
            resultsDiv.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-gray-400 mb-4">
                        <i class="fas fa-search text-4xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-900 mb-2">No jobs found</h3>
                    <p class="text-gray-600">Try adjusting your search criteria</p>
                </div>
            `;
            return;
        }

        const jobsContainer = append ? resultsDiv : document.createElement('div');
        
        jobs.forEach(job => {
            const jobElement = document.createElement('div');
            jobElement.className = 'bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow duration-200 mb-4 overflow-hidden';
            
            jobElement.innerHTML = `
                <a href="${job.url}" class="block p-6" target="${job.source === 'external' ? '_blank' : '_self'}">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center">
                                <h3 class="text-xl font-semibold text-gray-900">${job.title}</h3>
                                <span class="ml-2 px-2 py-1 text-xs font-medium rounded-full ${job.source === 'external' ? 'bg-purple-100 text-purple-800' : 'bg-green-100 text-green-800'}">
                                    ${job.source === 'external' ? 'External' : 'Local'}
                                </span>
                            </div>
                            <div class="mt-2 flex items-center text-gray-600 text-sm">
                                <span class="mr-4"><i class="fas fa-building mr-2"></i>${job.company_name}</span>
                                ${job.company_location ? `<span><i class="fas fa-map-marker-alt mr-2"></i>${job.company_location}</span>` : ''}
                            </div>
                            ${job.job_type ? `
                                <div class="mt-2 text-sm text-gray-600">
                                    <i class="fas fa-briefcase mr-2"></i>${job.job_type}
                                </div>
                            ` : ''}
                            ${job.salary ? `
                                <div class="mt-2 text-sm text-gray-600">
                                    <i class="fas fa-money-bill-wave mr-2"></i>${job.salary}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </a>
            `;
            
            if (!append) {
                jobsContainer.appendChild(jobElement);
            } else {
                resultsDiv.appendChild(jobElement);
            }
        });

        if (!append) {
            resultsDiv.appendChild(jobsContainer);
        }
    }

    function displayError(message) {
        const resultsDiv = document.getElementById('job-results');
        resultsDiv.innerHTML = `
            <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-exclamation-circle text-red-400"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700">${message}</p>
                    </div>
                </div>
            </div>
        `;
    }

    // Initialize search if URL has parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('query') || urlParams.has('location') || urlParams.has('source')) {
        document.getElementById('query').value = urlParams.get('query') || '';
        document.getElementById('location').value = urlParams.get('location') || '';
        document.getElementById('source').value = urlParams.get('source') || 'local';
        performSearch();
    }

    document.getElementById('search-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await performSearch();
        
        // Update URL with search parameters
        const query = document.getElementById('query').value;
        const location = document.getElementById('location').value;
        const source = document.getElementById('source').value;
        const params = new URLSearchParams({ query, location, source });
        const newUrl = `${window.location.pathname}?${params}`;
        window.history.pushState({}, '', newUrl);
    });

    document.getElementById('load-more').addEventListener('click', async () => {
        currentPage++;
        await performSearch(true);
    });
</script>
{% endblock %}
